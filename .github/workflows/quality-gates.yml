# quality-gates: one Python version per pull request, full matrix on tags.
# Each gate is its own step, named like the local stage of tools/check.sh.
name: quality-gates

on:
  pull_request:
    branches: [main, develop]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  gates:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: "system libraries for Qt (offscreen)"
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: "[0] privacy"
        run: tools/check.sh --only privacy
      - name: "[1] format"
        run: tools/check.sh --only format
      - name: "[2] lint"
        run: tools/check.sh --only lint
      - name: "[3] types"
        run: tools/check.sh --only types
      - name: "[4] security"
        run: tools/check.sh --only security
      - name: "[5] tests"
        run: tools/check.sh --only tests --json gates.json
      - name: "job summary"
        if: always()
        run: python3 tools/gate_summary.py gates.json >> "$GITHUB_STEP_SUMMARY" || true

  gates-matrix:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: "system libraries for Qt (offscreen)"
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: tools/check.sh

  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gates-matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "tag is on main"
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: "tag equals __version__"
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/scanbench/__init__.py)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
